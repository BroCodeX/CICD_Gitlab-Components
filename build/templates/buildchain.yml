spec:
  inputs:
    stage:
      description: "Job stage"
      default: "build"
    context:
      description: "Build context"
      default: '.'
    dockerfile_dir:
      description: "Path to directory with dockerfile"
      default: ./docker
    dockerfile_name:
      description: |
        Dockerfile name inside `dockerfile_dir`
      default: "Dockerfile"
    image_name:
      description: Image name like 'nginx' or 'app'
    registry:
      description: "Container registry URL to authenticate against"
      type: string
      default: "${CI_REGISTRY_IMAGE}"
    registry_user:
      description: "Registry username"
      type: string
      default: $CI_REGISTRY_USER
    registry_password:
      description: "Registry password or token"
      type: string
      default: $CI_REGISTRY_PASSWORD
---

include:

  # Hadolint scan
  - component: $CI_SERVER_FQDN/components/devsec/hadolint_scan@1
    inputs:
      stage: $[[ inputs.stage ]]
      job_name: "$[[ inputs.dockerfile_name ]]-$[[ inputs.image_name ]]"
      dockerfile_dir: $[[ inputs.dockerfile_dir ]]
      dockerfile_name: $[[ inputs.dockerfile_name ]]
      allow_failure: false

  # Build image
  - component: $CI_SERVER_FQDN/components/build/build@1
    inputs:
      stage: $[[ inputs.stage ]]
      job_name: $[[ inputs.image_name ]]
      context: $[[ inputs.context ]]
      dockerfile_dir: $[[ inputs.dockerfile_dir ]]
      dockerfile_name: $[[ inputs.dockerfile_name ]]
      image_name: $[[ inputs.image_name ]]
      push_to_latest: true
      registry: $[[ inputs.registry ]]
      registry_user: $[[ inputs.registry_user ]]
      registry_password: $[[ inputs.registry_password ]]
      needs:
        - "hadolint-$[[ inputs.dockerfile_name ]]-$[[ inputs.image_name ]]"
