spec:
  inputs:
    stage:
      description: "Job stage"
      default: "build"
    context:
      description: "Build context"
      default: '.'
    dockerfile_dir:
      description: "Path to directory with dockerfile"
      default: ./docker
    dockerfile_name:
      description: |
        Dockerfile name inside `dockerfile_dir`
      default: "Dockerfile"
    image_name:
      description: Image name like 'nginx' or 'app'
    tag:
      description: Image tag
      default: "${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}"
    latest_image_tag:
      description: Image tag with 'latest' suffix. Pushed if push_to_latest is true
      default: "${CI_COMMIT_REF_SLUG}-latest"
    push_to_latest:
      description: If true push image also to latest_image_tag
      type: boolean
      default: false
    registry:
      description: "Container registry URL to authenticate against"
      type: string
      default: "${CI_REGISTRY_IMAGE}"
    registry_user:
      description: "Registry username"
      type: string
      default: $CI_REGISTRY_USER
    registry_password:
      description: "Registry password or token"
      type: string
      default: $CI_REGISTRY_PASSWORD
    rules_config:
      description: Gitlab CI rules
      type: array
      default:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          when: manual
        - if: $CI_OPEN_MERGE_REQUESTS
          when: never
        - if: $CI_COMMIT_BRANCH
        - if: $CI_PIPELINE_SOURCE == "web"
          when: manual
---

include:

  # Hadolint scan
  - component: $CI_SERVER_FQDN/components/devsec/hadolint_scan@1
    inputs:
      stage: $[[ inputs.stage ]]
      job_name: "$[[ inputs.dockerfile_name ]]-$[[ inputs.image_name ]]"
      dockerfile_dir: $[[ inputs.dockerfile_dir ]]
      dockerfile_name: $[[ inputs.dockerfile_name ]]
      allow_failure: false
      rules_config: $[[ inputs.rules_config ]]

  # Build image
  - component: $CI_SERVER_FQDN/components/build/build@1
    inputs:
      stage: $[[ inputs.stage ]]
      job_name: $[[ inputs.image_name ]]
      context: $[[ inputs.context ]]
      dockerfile_dir: $[[ inputs.dockerfile_dir ]]
      dockerfile_name: $[[ inputs.dockerfile_name ]]
      image_name: $[[ inputs.image_name ]]
      tag: $[[ inputs.tag ]]
      latest_image_tag: $[[ inputs.latest_image_tag ]]
      push_to_latest: $[[ inputs.push_to_latest ]]
      registry: $[[ inputs.registry ]]
      registry_user: $[[ inputs.registry_user ]]
      registry_password: $[[ inputs.registry_password ]]
      rules_config: $[[ inputs.rules_config ]]
      needs:
        - "hadolint-$[[ inputs.dockerfile_name ]]-$[[ inputs.image_name ]]"
